<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>盐酸NaOH中和微观｜5s内H⁺与OH⁻两两配对结合</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:#fff;height:100vh;overflow:hidden;}
#container{width:100%;height:92%;position:relative;border:2px solid #666;margin-bottom:8px;overflow:hidden;}
.box{width:48%;height:100%;position:absolute;top:0;border:1px solid #aaa;overflow:hidden;}
#leftBox{left:0;background:#f0f8ff;}
#rightBox{right:0;background:#fff2f2;}
#mixArea{width:100%;height:100%;position:absolute;top:0;left:0;display:none;background:#f4f4f8;overflow:hidden;}
.particle{border-radius:50%;position:absolute;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold;font-size:14px;}
.Hplus{width:24px;height:24px;background:#ff4444;color:white;}
.Clminus{width:36px;height:36px;background:#39b54a;color:white;}
.Naplus{width:30px;height:30px;background:#ffcc00;color:#222;}
.OHminus{width:42px;height:42px;background:#4488ff;color:white;}
.H2O{width:48px;height:48px;background:#66aaff;color:white;}
.ctrl{text-align:center;}
button{padding:8px 16px;margin:0 6px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div id="container">
    <div id="leftBox" class="box"></div>
    <div id="rightBox" class="box"></div>
    <div id="mixArea"></div>
</div>
<div class="ctrl">
    <button id="btnMix">混合两种溶液</button>
    <button id="btnReset">重置</button>
</div>

<script>
const leftBox = document.getElementById('leftBox');
const rightBox = document.getElementById('rightBox');
const mixArea = document.getElementById('mixArea');
const btnMix = document.getElementById('btnMix');
const btnReset = document.getElementById('btnReset');

let particles = [];
let animId = null;
let isMixed = false;
let mixStartTime = 0;
const REACTION_DURATION = 5000;
const COLLIDE_DIST = 36;

function createParticle(type, parent){
    const el = document.createElement('div');
    el.className = 'particle '+type;
    const map = {Hplus:'H⁺',Clminus:'Cl⁻',Naplus:'Na⁺',OHminus:'OH⁻',H2O:'H₂O'};
    el.innerText = map[type];
    const w = parent.clientWidth;
    const h = parent.clientHeight;
    const maxX = w - 50;
    const maxY = h - 50;
    const x = Math.random()*maxX;
    const y = Math.random()*maxY;
    el.style.left = x+'px';
    el.style.top = y+'px';
    parent.appendChild(el);
    const p = {
        el,
        type,
        x,
        y,
        vx: (Math.random()-0.5)*1.0,
        vy: (Math.random()-0.5)*1.0,
        parent,
        pairTarget: null
    };
    particles.push(p);
    return p;
}

function getDist(p1,p2){
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    return Math.sqrt(dx*dx + dy*dy);
}

function buildPairs(){
    const Hlist = particles.filter(p=>p.type==='Hplus' && !p.pairTarget);
    const OHlist = particles.filter(p=>p.type==='OHminus' && !p.pairTarget);
    const pairCount = Math.min(Hlist.length, OHlist.length);
    for(let i=0;i<pairCount;i++){
        Hlist[i].pairTarget = OHlist[i];
        OHlist[i].pairTarget = Hlist[i];
    }
}

function animate(timestamp){
    if(isMixed){
        const elapsed = timestamp - mixStartTime;
        buildPairs();

        const Hs = particles.filter(p=>p.type==='Hplus' && p.pairTarget);
        for(const hp of Hs){
            const oh = hp.pairTarget;
            const d = getDist(hp, oh);
            if(d > COLLIDE_DIST){
                const dx = oh.x - hp.x;
                const dy = oh.y - hp.y;
                const len = Math.sqrt(dx*dx+dy*dy);
                const progress = Math.min(elapsed / REACTION_DURATION, 1);
                const force = 0.02 + progress * 0.06;
                hp.vx += (dx/len)*force;
                hp.vy += (dy/len)*force;
                oh.vx -= (dx/len)*force;
                oh.vy -= (dy/len)*force;
            }
        }
    }

    for(const p of particles){
        p.x += p.vx;
        p.y += p.vy;
        const w = p.parent.clientWidth - 50;
        const h = p.parent.clientHeight - 50;
        if(p.x <=0 || p.x >= w) p.vx *= -1;
        if(p.y <=0 || p.y >= h) p.vy *= -1;
        const spd = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
        if(spd>2.0){
            p.vx = (p.vx/spd)*2.0;
            p.vy = (p.vy/spd)*2.0;
        }
        p.el.style.left = p.x+'px';
        p.el.style.top = p.y+'px';
    }

    if(isMixed){
        const toRemove = new Set();
        const Hs = particles.filter(p=>p.type==='Hplus');
        const OHs = particles.filter(p=>p.type==='OHminus');
        for(const hp of Hs){
            for(const oh of OHs){
                if(getDist(hp,oh) < COLLIDE_DIST){
                    toRemove.add(hp);
                    toRemove.add(oh);
                    createParticle('H2O', mixArea);
                    break;
                }
            }
        }
        toRemove.forEach(p=> p.el.remove());
        particles = particles.filter(p=>!toRemove.has(p));
    }

    animId = requestAnimationFrame(animate);
}

function stopAnim(){
    if(animId) cancelAnimationFrame(animId);
    animId=null;
}

function init(){
    stopAnim();
    isMixed = false;
    particles=[];
    leftBox.style.display='block';
    rightBox.style.display='block';
    mixArea.style.display='none';
    leftBox.innerHTML='';rightBox.innerHTML='';mixArea.innerHTML='';
    for(let i=0;i<4;i++) createParticle('Hplus',leftBox);
    for(let i=0;i<4;i++) createParticle('Clminus',leftBox);
    for(let i=0;i<4;i++) createParticle('Naplus',rightBox);
    for(let i=0;i<4;i++) createParticle('OHminus',rightBox);
    animId = requestAnimationFrame(animate);
}

btnMix.onclick=()=>{
    stopAnim();
    isMixed = true;
    mixStartTime = performance.now();
    leftBox.style.display='none';
    rightBox.style.display='none';
    mixArea.style.display='block';
    particles=[];
    for(let i=0;i<4;i++) createParticle('Hplus',mixArea);
    for(let i=0;i<4;i++) createParticle('Clminus',mixArea);
    for(let i=0;i<4;i++) createParticle('Naplus',mixArea);
    for(let i=0;i<4;i++) createParticle('OHminus',mixArea);
    animId = requestAnimationFrame(animate);
}

btnReset.onclick=init;
init();
</script>
</body>
</html>
